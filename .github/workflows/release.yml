name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-mcp-adapter@$version" version >/dev/null 2>&1; then
            echo "dsh-mcp-adapter@$version is already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          notes_file="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version" '
              BEGIN { p=0 }
              $0 ~ "^## \\[" ver "\\]" { p=1; next }
              p && $0 ~ /^## / { exit }
              p { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            printf 'dsh-mcp-adapter %s\n' "$version" > "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
